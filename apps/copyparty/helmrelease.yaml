# Copyparty: web file server for the shared folder on pve1's USB drive.
# Settings in config.yaml; no login, reachable only from the tailnet.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: copyparty
  namespace: copyparty
spec:
  interval: 1h
  releaseName: copyparty
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # owner of the shared folder on the drive
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      copyparty:
        # ponytail: config is mounted via subPath and never live-updates;
        # after changing config.yaml: kubectl rollout restart -n copyparty deploy/copyparty
        strategy: Recreate # single local volume for the index
        containers:
          app:
            image:
              repository: copyparty/ac
              tag: 1.20.25
            env:
              LD_PRELOAD: /usr/lib/libmimalloc-secure.so.2 # faster, hardened allocator shipped in the image
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi # thumbnailing large videos with ffmpeg

    service:
      app:
        controller: copyparty
        ports:
          http:
            port: 3923

    ingress:
      app:
        className: tailscale
        hosts:
          - host: "" # tailscale drops rules that carry a host
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - files # MagicDNS name: files.<tailnet>.ts.net

    persistence:
      shared:
        existingClaim: copyparty-shared # shared-pvc.yaml: /mnt/immich-data/shared on pve1
        globalMounts:
          - path: /w
      state:
        # index database and thumbnails; rebuilt automatically if lost
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /cfg
      config:
        type: configMap
        name: copyparty-config
        globalMounts:
          - path: /cfg/copyparty.conf
            subPath: copyparty.conf
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
          - path: /state
            subPath: state
