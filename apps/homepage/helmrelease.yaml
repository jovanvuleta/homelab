# Homepage has no maintained chart; bjw-s app-template describes the workload.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  releaseName: homepage
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      homepage:
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.4.0
            env:
              HOMEPAGE_ALLOWED_HOSTS: homepage.tail65d0f1.ts.net,homepage.homepage.svc.cluster.local:3000 # Tailscale URL + in-cluster name Gatus checks
              LOG_TARGETS: stdout
            # HOMEPAGE_VAR_* values, referenced in services.yaml as {{HOMEPAGE_VAR_...}}
            envFrom:
              - secretRef:
                  name: homepage-widgets
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      app:
        controller: homepage
        ports:
          http:
            port: 3000

    ingress:
      app:
        className: tailscale
        hosts:
          - host: "" # tailscale drops rules that carry a host
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - homepage # MagicDNS name: homepage.<tailnet>.ts.net

    configMaps:
      config:
        data:
          settings.yaml: |
            title: Homelab
            theme: dark
            color: slate
            headerStyle: clean
            layout:
              Apps:
                style: row
                columns: 3
              Monitoring:
                style: row
                columns: 3
              Infrastructure:
                style: row
                columns: 3
          widgets.yaml: |
            - datetime:
                text_size: xl
                format:
                  dateStyle: long
                  timeStyle: short
          services.yaml: |
            - Apps:
                - Immich:
                    href: https://immich.tail65d0f1.ts.net
                    icon: immich.png
                    description: Photos and videos
                    siteMonitor: http://immich-server.immich.svc.cluster.local:2283/api/server/ping
                    widget:
                      type: immich
                      url: http://immich-server.immich.svc.cluster.local:2283
                      key: '{{ "{{HOMEPAGE_VAR_IMMICH_KEY}}" }}'
                      version: 2
                - Home Assistant:
                    href: https://homeassistant.tail65d0f1.ts.net
                    icon: home-assistant.png
                    description: Home automation
                - AdGuard Home:
                    href: https://adguard.tail65d0f1.ts.net
                    icon: adguard-home.png
                    description: Ad and tracker blocking (tailnet DNS)
                    siteMonitor: http://adguard-app.adguard.svc.cluster.local
                    widget:
                      type: adguard
                      url: http://adguard-app.adguard.svc.cluster.local
                      username: '{{ "{{HOMEPAGE_VAR_ADGUARD_USER}}" }}'
                      password: '{{ "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}" }}'
                - Copyparty:
                    href: https://files.tail65d0f1.ts.net
                    icon: copyparty.png
                    description: Shared files (web, upload from any device)
                    siteMonitor: http://copyparty.copyparty.svc.cluster.local:3923
            - Monitoring:
                - Grafana:
                    href: https://grafana.tail65d0f1.ts.net
                    icon: grafana.png
                    description: Dashboards
                    siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
                    widget:
                      type: grafana
                      version: 2 # Grafana 11+ removed the legacy /api/alerts endpoint
                      url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
                      username: admin
                      password: '{{ "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}" }}'
                - Status:
                    href: https://status.tail65d0f1.ts.net
                    icon: gatus.png
                    description: Service uptime (Gatus)
                    siteMonitor: http://gatus.gatus.svc.cluster.local
                - Prometheus:
                    icon: prometheus.png
                    description: Scrape targets
                    widget:
                      type: prometheus
                      url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            - Infrastructure:
                - Proxmox:
                    href: https://pve1.tail65d0f1.ts.net:8006
                    icon: proxmox.png
                    description: pve1 hypervisor
                - GitHub:
                    href: https://github.com/jovanvuleta/homelab
                    icon: github.png
                    description: This homelab, as code
          bookmarks.yaml: ""
          kubernetes.yaml: ""
          docker.yaml: ""
          custom.css: ""
          custom.js: ""

    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - { path: /app/config/settings.yaml, subPath: settings.yaml }
          - { path: /app/config/widgets.yaml, subPath: widgets.yaml }
          - { path: /app/config/services.yaml, subPath: services.yaml }
          - { path: /app/config/bookmarks.yaml, subPath: bookmarks.yaml }
          - { path: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
          - { path: /app/config/docker.yaml, subPath: docker.yaml }
          - { path: /app/config/custom.css, subPath: custom.css }
          - { path: /app/config/custom.js, subPath: custom.js }
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
