# Overrides only — chart defaults documented in full in values.yaml (not
# applied directly; Helm already merges these over the chart's own defaults).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  releaseName: immich
  chart:
    spec:
      chart: immich
      version: "0.13.4"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  values:
    controllers:
      main:
        containers:
          main:
            env:
              # ours: point at the CloudNativePG cluster's auto-generated app secret
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
    immich:
      persistence:
        library:
          existingClaim: immich-library # ours: created in library-pvc.yaml
      metrics:
        enabled: true # ours: Prometheus scrapes Immich via ServiceMonitors
    valkey:
      enabled: true # ours: default false, we use the chart's bundled Valkey (Redis fork) instead of an external one
    server:
      ingress:
        main:
          enabled: true # ours: default false, exposed via the Tailscale ingress class
          className: tailscale # ours
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
          hosts:
            - host: "" # ours: empty — the tailscale operator drops the whole rule if a non-empty host is set (only unqualified rules get a backend); schema requires the key present
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - hosts:
                - immich # ours: MagicDNS name, becomes immich.<tailnet>.ts.net
