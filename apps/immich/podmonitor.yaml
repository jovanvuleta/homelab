# CloudNativePG deprecated `monitoring.enablePodMonitor`; scrape the Postgres
# instances' metrics port directly instead.
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: immich-database
  namespace: immich
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: immich-database
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
