# Reference only — not applied directly. The chart is installed via the
# HelmRelease in helmrelease.yaml, which only carries our overrides on top of
# these chart defaults (Helm merges automatically). Kept here in full so
# every available option stays visible without digging through the chart.
#
# Full default values.yaml from immich-charts (chart 0.13.2), with our overrides
# filled in inline (marked "ours") so every available option stays visible.
# Source: https://github.com/immich-app/immich-charts/blob/immich-0.13.2/charts/immich/values.yaml

## This chart relies on the common library chart from bjw-s
## You can find it at https://github.com/bjw-s-labs/helm-charts/tree/common-5.0.1/charts/library/common
## Refer there for more detail about the supported values

# These entries are shared between all the Immich components

controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.0
        env:
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
          # ours: point at the CloudNativePG cluster's auto-generated app secret
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: host
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: user
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: dbname
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password

immich:
  metrics:
    # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
    enabled: false
  persistence:
    # Main data store for all photos shared between different components.
    library:
      # Automatically creating the library volume is not supported by this chart
      # You have to specify an existing PVC to use
      existingClaim: immich-library # ours: created in library-pvc.yaml
  # configuration is immich-config.json converted to yaml. Ignored if existingConfiguration is set.
  # ref: https://immich.app/docs/install/config-file/
  #
  configuration: {}
    # trash:
    #   enabled: false
    #   days: 30
    # storageTemplate:
    #   enabled: true
    #   template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
  # Sets the resource Kind to store configuration in. Must be either ConfigMap or Secret.
  configurationKind: ConfigMap

  # Specify existing configuration resource name here to skip creation of a new one
  # existingConfiguration:

# Dependencies

valkey:
  enabled: true # ours: default false, we use the chart's bundled Valkey (Redis fork) instead of an external one
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1-alpine@sha256:a35428eba9043cc0b79dbe54100f0c92784f2de00ad09b01182bfb1c5c83d1bd
            pullPolicy: IfNotPresent
  persistence:
    data:
      enabled: true
      type: emptyDir
      # Optional: to keep job queues persistent, replace `type: emptyDir` above with:
      #   type: persistentVolumeClaim
      #   size: 1Gi
      #   accessMode: ReadWriteOnce
      #   # storageClass: your-class

# Immich components

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
  ingress:
    main:
      enabled: true # ours: default false, exposed via the Tailscale ingress class
      className: tailscale # ours
      annotations:
        # proxy-body-size is set to 0 to remove the body limit on file uploads
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
      hosts:
        - host: "" # ours: empty — the tailscale operator drops the whole rule if a non-empty host is set (only unqualified rules get a backend); schema requires the key present
          paths:
            - path: "/"
              service:
                identifier: main
      tls:
        - hosts:
            - immich # ours: MagicDNS name, becomes immich.<tailnet>.ts.net

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
          # ponytail: no GPU passthrough on this VM, plain CPU inference via the
          # default image tag above. Add "-openvino" to controllers.main.image.tag
          # (shared, top of file) + mount /dev/dri if you pass an iGPU through later.
  persistence:
    cache:
      enabled: true
      type: emptyDir
      # Optional: to avoid downloading the ML models on every start, replace `type: emptyDir` above with:
      #   type: persistentVolumeClaim
      #   size: 10Gi
      #   accessMode: ReadWriteMany
      #   # storageClass: your-class
