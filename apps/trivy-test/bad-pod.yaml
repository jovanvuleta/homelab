# Test manifest for the Trivy PR check, now hardened. Not referenced by any
# Flux Kustomization, so it is never deployed. Delete with the test PR.
---
apiVersion: v1
kind: Pod
metadata:
  name: trivy-test-bad
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
