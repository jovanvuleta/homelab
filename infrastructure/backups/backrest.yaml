# Backrest: web UI to browse the B2 snapshots and restore or download files.
# Browse/restore only: no backup plans, no prune or check schedules; the
# restic-b2 CronJob stays the one that writes and prunes.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backrest
  namespace: backups
spec:
  interval: 1h
  releaseName: backrest
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      backrest:
        strategy: Recreate # single volume, single writer
        initContainers:
          seed:
            image: &image
              repository: garethgeorge/backrest
              tag: v1.14.1-alpine
            command: ["/bin/sh", "-c"]
            args:
              - mkdir -p /state/config && [ -f /state/config/config.json ] || cp /seed/config.json /state/config/config.json
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image: *image
            envFrom:
              - secretRef:
                  name: restic-b2 # B2 key, repository, restic password
            env:
              BACKREST_DATA: /state/data
              BACKREST_CONFIG: /state/config/config.json
              XDG_CACHE_HOME: /cache
              TMPDIR: /tmp
              TZ: Europe/Belgrade
            securityContext: *securityContext
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 512Mi # restic restores of larger files

    service:
      app:
        controller: backrest
        ports:
          http:
            port: 9898

    ingress:
      app:
        className: tailscale
        hosts:
          - host: "" # tailscale drops rules that carry a host
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - backrest # MagicDNS name: backrest.<tailnet>.ts.net

    persistence:
      state:
        # config, login and operation history. No subPath on local-path volumes (see README).
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /state
      seed:
        type: configMap
        name: backrest-seed
        advancedMounts:
          backrest:
            seed:
              - path: /seed
                readOnly: true
      cache:
        type: emptyDir # restic's index cache, rebuilt from B2 when needed
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir # restore targets and downloads
        globalMounts:
          - path: /tmp
