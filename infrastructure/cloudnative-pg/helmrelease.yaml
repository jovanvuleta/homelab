# App version 1.30.0 — matches the raw manifest release this replaced
# (cloudnative-pg/cloudnative-pg release-1.30/cnpg-1.30.0.yaml).
# https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.0.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  releaseName: cnpg
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
  # CRDs are large enough that a plain `kubectl apply` trips Kubernetes'
  # annotation size limit (see README) — Helm installs/updates them directly
  # instead, so CreateReplace keeps them current across chart upgrades too.
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
