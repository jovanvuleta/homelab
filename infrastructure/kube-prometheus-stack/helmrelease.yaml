---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  releaseName: kube-prometheus-stack
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.1.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Talos binds these to localhost; scraping them needs a Talos machine
    # config patch first, otherwise they'd show as permanently down.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 10d
        retentionSize: 12GB
        # Pick up ServiceMonitors/PodMonitors/rules from every namespace.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          # local-path volumes ignore fsGroup, so a root-owned subPath isn't
          # writable by Prometheus (uid 1000); mount the volume root instead.
          disableMountSubPath: true
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 15Gi
    alertmanager:
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-telegram/
        secrets:
          - alertmanager-telegram
          - alertmanager-healthchecks
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # Always firing by design: forwarded every minute to healthchecks.io as a
            # heartbeat. If the pings stop, healthchecks.io alerts from outside.
            - receiver: healthchecks
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
            # Informational alerts (e.g. CPUThrottlingHigh) are visible in
            # Grafana/Alertmanager but not worth a phone notification.
            - receiver: "null"
              matchers:
                - severity = "info"
        inhibit_rules:
          # A critical alert silences the matching warning/info for the same thing.
          - source_matchers: [severity = "critical"]
            target_matchers: [severity =~ "warning|info"]
            equal: [namespace, alertname]
          - source_matchers: [severity = "warning"]
            target_matchers: [severity = "info"]
            equal: [namespace, alertname]
          - source_matchers: [alertname = "InfoInhibitor"]
            target_matchers: [severity = "info"]
            equal: [namespace]
        receivers:
          - name: "null"
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/ping-url
                send_resolved: false
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id: 1578466488
                parse_mode: HTML
                send_resolved: true
    grafana:
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
      # GF_AUTH_GITHUB_CLIENT_ID / _SECRET; Grafana reads GF_* env over grafana.ini.
      envFromSecret: grafana-github-oauth
      grafana.ini:
        server:
          root_url: https://grafana.antelope-armadillo.ts.net # OAuth callback base
        auth.github:
          enabled: true
          allow_sign_up: true
          scopes: user:email,read:org # read:org: Grafana always looks up team memberships
          auth_url: https://github.com/login/oauth/authorize
          token_url: https://github.com/login/oauth/access_token
          api_url: https://api.github.com/user
          # Only this GitHub account may log in (as server admin); with strict
          # mode an empty role denies everyone else.
          role_attribute_path: "login == 'jovanvuleta' && 'GrafanaAdmin' || ''"
          role_attribute_strict: true
          allow_assign_grafana_admin: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      defaultDashboardsTimezone: browser
      ingress:
        enabled: true
        ingressClassName: tailscale
        hosts: [] # tailscale drops rules that carry a host
        tls:
          - hosts:
              - grafana # MagicDNS name: grafana.<tailnet>.ts.net
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: homelab
              orgId: 1
              folder: Homelab
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/homelab
      dashboards:
        homelab:
          cloudnative-pg:
            gnetId: 20417
            revision: 4
            datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
              - name: DS_EXPRESSION
                value: __expr__
          immich:
            gnetId: 22555
            revision: 1
            datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
              - name: DS_LOKI
                value: Loki
          trivy-operator:
            gnetId: 16337
            revision: 16
            datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
          proxmox:
            gnetId: 10347 # Proxmox via Prometheus (pve-exporter)
            revision: 5
            datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
