# Proxies sit behind the node's NAT, so peers fall back to the DERP relay.
# Static NodePort endpoints let LAN devices connect directly to <node-ip>:<port>.
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: direct
spec:
  staticEndpoints:
    nodePort:
      ports:
        - port: 30041
          endPort: 30060
